name: One-time ComfyUI block formatting

on:
  push:
    branches: [feature/ai-production-pipeline]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Format ComfyUI injection block'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/ai-production-pipeline
      - name: Indent the injected branch block
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/lib/production.ts")
          text = path.read_text(encoding="utf-8")
          start = text.index('\nif (type === "IMAGE_TO_VIDEO") {') + 1
          end = text.index('\n\n  const response = await fetchComfy', start)
          block = text[start:end]
          formatted = '\n'.join(f'  {line}' if line else line for line in block.splitlines())
          path.write_text(text[:start] + formatted + text[end:], encoding="utf-8")
          PY
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/production.ts
          git commit -m "Format ComfyUI workflow injection"
          git push origin HEAD:feature/ai-production-pipeline
