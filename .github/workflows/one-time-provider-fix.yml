name: One-time provider nullability fix

on:
  push:
    branches: [feature/ai-production-pipeline]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Prepare provider nullability fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/ai-production-pipeline
      - name: Apply the narrow source edit
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/lib/production.ts')
          text = path.read_text(encoding='utf-8')

          old_url = '  const url = `${config.apiBaseUrl.replace(/\\/+$/, "")}/chat/completions`;'
          new_url = '  const { apiBaseUrl, apiKey, modelName } = config;\n  const url = `${apiBaseUrl.replace(/\\/+$/, "")}/chat/completions`;'
          if text.count(old_url) != 1:
              raise SystemExit('Expected provider URL expression exactly once.')
          text = text.replace(old_url, new_url)

          old_key = '        Authorization: `Bearer ${config.apiKey}`,'
          if text.count(old_key) != 1:
              raise SystemExit('Expected provider key expression exactly once.')
          text = text.replace(old_key, '        Authorization: `Bearer ${apiKey}`,')

          old_model = '        model: config.modelName,'
          if text.count(old_model) != 1:
              raise SystemExit('Expected provider model expression exactly once.')
          text = text.replace(old_model, '        model: modelName,')

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit the focused fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/production.ts
          git commit -m "Fix AI provider config narrowing"
          git push origin HEAD:feature/ai-production-pipeline
