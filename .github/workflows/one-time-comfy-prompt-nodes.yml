name: One-time ComfyUI prompt node migration

on:
  push:
    branches: [feature/ai-production-pipeline]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Prepare separate ComfyUI prompt node support'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/ai-production-pipeline

      - name: Patch ComfyUI injection logic
        run: |
          python - <<'PY'
          from pathlib import Path

          production = Path("src/lib/production.ts")
          text = production.read_text(encoding="utf-8")

          old_guard = '''  if (type === "IMAGE_TO_VIDEO" && !shot.motionPrompt?.trim()) {
            throw new Error("No motion prompt is set for this shot.");
          }
          '''
          new_guard = '''  if (type === "IMAGE_TO_VIDEO" && !shot.positivePrompt?.trim()) {
            throw new Error("No positive prompt is set for this shot.");
          }
          if (type === "IMAGE_TO_VIDEO" && !shot.negativePrompt?.trim()) {
            throw new Error("No negative prompt is set for this shot.");
          }
          '''
          if text.count(old_guard) != 1:
              raise SystemExit("Expected the old I2V prompt guard exactly once.")
          text = text.replace(old_guard, new_guard)

          start_marker = '  const imageNode = process.env.COMFY_IMAGE_NODE;\n'
          end_marker = '  setNodeInput(workflow, outputNode, process.env.COMFY_OUTPUT_INPUT ?? "filename_prefix", prefix);\n'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("Could not locate the existing ComfyUI injection block.")
          end += len(end_marker)

          replacement = '''  const prefix = `${type === "UPSCALE" ? "final" : "preview"}/${sanitizedShotId(shot)}`;

            if (type === "IMAGE_TO_VIDEO") {
              const imageNode = process.env.COMFY_IMAGE_NODE;
              const positivePromptNode =
                process.env.COMFY_POSITIVE_PROMPT_NODE ?? process.env.COMFY_PROMPT_NODE;
              const negativePromptNode = process.env.COMFY_NEGATIVE_PROMPT_NODE;
              const outputNode = process.env.COMFY_OUTPUT_NODE;

              if (!imageNode || !positivePromptNode || !negativePromptNode || !outputNode) {
                throw new Error(
                  "ComfyUI I2V node mapping is incomplete. Configure COMFY_IMAGE_NODE, COMFY_POSITIVE_PROMPT_NODE, COMFY_NEGATIVE_PROMPT_NODE, and COMFY_OUTPUT_NODE in .env.",
                );
              }

              // ComfyUI subgraph IDs such as "129:93" are JSON object keys. Keep them
              // as strings and address them directly instead of parsing them as integers.
              setNodeInput(
                workflow,
                imageNode,
                process.env.COMFY_IMAGE_INPUT ?? "image",
                inputPath,
              );
              setNodeInput(
                workflow,
                positivePromptNode,
                process.env.COMFY_POSITIVE_PROMPT_INPUT ??
                  process.env.COMFY_PROMPT_INPUT ??
                  "text",
                shot.positivePrompt.trim(),
              );
              setNodeInput(
                workflow,
                negativePromptNode,
                process.env.COMFY_NEGATIVE_PROMPT_INPUT ?? "text",
                shot.negativePrompt.trim(),
              );
              setOptionalNodeInput(
                workflow,
                process.env.COMFY_SEED_NODE,
                process.env.COMFY_SEED_INPUT ?? "seed",
                Number(shot.seed || Date.now() % 2_147_483_647),
              );
              setOptionalNodeInput(
                workflow,
                process.env.COMFY_WIDTH_NODE,
                process.env.COMFY_WIDTH_INPUT ?? "width",
                shot.width ?? shot.project.defaultWidth,
              );
              setOptionalNodeInput(
                workflow,
                process.env.COMFY_HEIGHT_NODE,
                process.env.COMFY_HEIGHT_INPUT ?? "height",
                shot.height ?? shot.project.defaultHeight,
              );
              setOptionalNodeInput(
                workflow,
                process.env.COMFY_FPS_NODE,
                process.env.COMFY_FPS_INPUT ?? "fps",
                shot.fps ?? shot.project.defaultFps,
              );
              setOptionalNodeInput(
                workflow,
                process.env.COMFY_DURATION_NODE,
                process.env.COMFY_DURATION_INPUT ?? "duration",
                shot.durationSeconds ?? 3,
              );
              setNodeInput(
                workflow,
                outputNode,
                process.env.COMFY_OUTPUT_INPUT ?? "filename_prefix",
                prefix,
              );
            } else {
              const legacyVideoNode = process.env.COMFY_IMAGE_NODE;
              const legacyOutputNode = process.env.COMFY_OUTPUT_NODE;
              const videoNode =
                process.env.COMFY_UPSCALE_VIDEO_NODE ??
                (legacyVideoNode && workflow[legacyVideoNode]
                  ? legacyVideoNode
                  : undefined);
              const outputNode =
                process.env.COMFY_UPSCALE_OUTPUT_NODE ??
                (legacyOutputNode && workflow[legacyOutputNode]
                  ? legacyOutputNode
                  : undefined);

              if (!videoNode || !outputNode) {
                throw new Error(
                  "ComfyUI upscale node mapping is incomplete. Configure COMFY_UPSCALE_VIDEO_NODE and COMFY_UPSCALE_OUTPUT_NODE in .env.",
                );
              }

              setNodeInput(
                workflow,
                videoNode,
                process.env.COMFY_UPSCALE_VIDEO_INPUT ?? "video",
                inputPath,
              );
              setOptionalNodeInput(
                workflow,
                process.env.COMFY_UPSCALE_WIDTH_NODE,
                process.env.COMFY_UPSCALE_WIDTH_INPUT ?? "width",
                1920,
              );
              setOptionalNodeInput(
                workflow,
                process.env.COMFY_UPSCALE_HEIGHT_NODE,
                process.env.COMFY_UPSCALE_HEIGHT_INPUT ?? "height",
                1080,
              );
              setOptionalNodeInput(
                workflow,
                process.env.COMFY_UPSCALE_FPS_NODE,
                process.env.COMFY_UPSCALE_FPS_INPUT ?? "frame_rate",
                shot.fps ?? shot.project.defaultFps,
              );
              setNodeInput(
                workflow,
                outputNode,
                process.env.COMFY_UPSCALE_OUTPUT_INPUT ?? "filename_prefix",
                prefix,
              );
            }
          '''
          text = text[:start] + replacement + text[end:]
          production.write_text(text, encoding="utf-8")

          route = Path("src/app/api/projects/[id]/production/route.ts")
          text = route.read_text(encoding="utf-8")
          old = '{ projectId: id, status: "APPROVED", sourceImagePath: { not: null }, motionPrompt: { not: null } }'
          new = '{ projectId: id, status: "APPROVED", sourceImagePath: { not: null }, positivePrompt: { not: null }, negativePrompt: { not: null } }'
          if text.count(old) != 1:
              raise SystemExit("Expected the animation queue filter exactly once.")
          route.write_text(text.replace(old, new), encoding="utf-8")

          panel = Path("src/components/ProductionProjectPanel.tsx")
          text = panel.read_text(encoding="utf-8")
          old_type = 'type Shot = { id: string; order: number; title: string | null; status: string; sourceImagePath: string | null; motionPrompt: string | null; previewVideoPath: string | null; finalVideoPath: string | null; jobs: Job[] };'
          new_type = 'type Shot = { id: string; order: number; title: string | null; status: string; sourceImagePath: string | null; positivePrompt: string | null; negativePrompt: string | null; motionPrompt: string | null; previewVideoPath: string | null; finalVideoPath: string | null; jobs: Job[] };'
          old_ready = 'const canAnimate = shot.status === "APPROVED" && Boolean(shot.sourceImagePath && shot.motionPrompt);'
          new_ready = 'const canAnimate = shot.status === "APPROVED" && Boolean(shot.sourceImagePath && shot.positivePrompt && shot.negativePrompt);'
          if text.count(old_type) != 1 or text.count(old_ready) != 1:
              raise SystemExit("Expected the production panel prompt readiness markers.")
          panel.write_text(
              text.replace(old_type, new_type).replace(old_ready, new_ready),
              encoding="utf-8",
          )
          PY

      - name: Commit the mapping fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/production.ts src/app/api/projects/[id]/production/route.ts src/components/ProductionProjectPanel.tsx
          git commit -m "Support separate ComfyUI prompt nodes"
          git push origin HEAD:feature/ai-production-pipeline
