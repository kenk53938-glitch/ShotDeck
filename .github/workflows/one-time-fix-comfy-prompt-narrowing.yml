name: One-time ComfyUI prompt narrowing fix

on:
  push:
    branches: [feature/ai-production-pipeline]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Prepare ComfyUI prompt narrowing fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/ai-production-pipeline
      - name: Apply focused TypeScript fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/lib/production.ts")
          text = path.read_text(encoding="utf-8")

          guards = '''  if (type === "IMAGE_TO_VIDEO" && !shot.positivePrompt?.trim()) {
            throw new Error("No positive prompt is set for this shot.");
          }
          if (type === "IMAGE_TO_VIDEO" && !shot.negativePrompt?.trim()) {
            throw new Error("No negative prompt is set for this shot.");
          }

          '''
          if text.count(guards) != 1:
              raise SystemExit("Expected the global prompt guards exactly once.")
          text = text.replace(guards, "")

          node_guard = '''    if (!imageNode || !positivePromptNode || !negativePromptNode || !outputNode) {
              throw new Error(
                "ComfyUI I2V node mapping is incomplete. Configure COMFY_IMAGE_NODE, COMFY_POSITIVE_PROMPT_NODE, COMFY_NEGATIVE_PROMPT_NODE, and COMFY_OUTPUT_NODE in .env.",
              );
            }

          '''
          prompt_guard = node_guard + '''    const positivePrompt = shot.positivePrompt?.trim();
            const negativePrompt = shot.negativePrompt?.trim();
            if (!positivePrompt) {
              throw new Error("No positive prompt is set for this shot.");
            }
            if (!negativePrompt) {
              throw new Error("No negative prompt is set for this shot.");
            }

          '''
          if text.count(node_guard) != 1:
              raise SystemExit("Expected the I2V node guard exactly once.")
          text = text.replace(node_guard, prompt_guard)

          if text.count("      shot.positivePrompt.trim(),") != 1:
              raise SystemExit("Expected the positive prompt injection exactly once.")
          if text.count("      shot.negativePrompt.trim(),") != 1:
              raise SystemExit("Expected the negative prompt injection exactly once.")
          text = text.replace("      shot.positivePrompt.trim(),", "      positivePrompt,")
          text = text.replace("      shot.negativePrompt.trim(),", "      negativePrompt,")

          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit the fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/production.ts
          git commit -m "Fix ComfyUI prompt type narrowing"
          git push origin HEAD:feature/ai-production-pipeline
